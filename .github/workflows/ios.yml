name: Orbit for iPhone

# Builds the iPhone app (ios/) for the simulator and runs its tests, including WebKit compiling
# every blocking list that tools/apple-rules.mjs makes from filters/rules.
#
# When the repository variable IOS_TESTFLIGHT is "on", a passing build is also signed and uploaded
# to TestFlight. The archive is unsigned and the App Store export signs it: Xcode creates the
# distribution certificate and App Store profile (no registered devices needed) with
# the Admin App Store Connect key in ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8_BASE64 (the notary
# key has the Developer role, which cannot create distribution certificates). The team comes from
# MAC_SIGNING_IDENTITY. The app record (bundle id org.novatech.orbit) exists in App Store Connect.

on:
  push:
    branches: [design]
    paths:
      - ios/**
      - tools/apple-rules.mjs
      - tools/apple-icon.sh
      - filters/rules/**
      - .github/workflows/ios.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Convert the blocking lists for WebKit
        run: |
          node --test tests/tools/apple-rules.test.mjs
          node tools/apple-rules.mjs ios/Orbit/Rules

      - name: Generate the Xcode project
        run: |
          brew install --quiet xcodegen librsvg
          tools/apple-icon.sh ios/Orbit/Assets.xcassets
          xcodegen generate --spec ios/project.yml
          xcodebuild -version

      - name: Pick a simulator
        id: simulator
        run: |
          id=$(xcrun simctl list devices available --json | python3 -I -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" in runtime:
                  for device in devices[runtime]:
                      if device["name"].startswith("iPhone"):
                          print(device["udid"]); sys.exit()
          ')
          test -n "$id"
          xcrun simctl list devices | grep "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/Orbit.xcodeproj \
            -scheme Orbit \
            -destination "id=${{ steps.simulator.outputs.id }}" \
            -resultBundlePath "$RUNNER_TEMP/Orbit.xcresult" \
            CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|warning: .*Orbit/|Test Case|Executed|\*\* (BUILD|TEST)" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" "$RUNNER_TEMP/xcodebuild.log"

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-results
          path: |
            ${{ runner.temp }}/Orbit.xcresult
            ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore

  testflight:
    needs: test
    if: vars.IOS_TESTFLIGHT == 'on'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Prepare the project
        run: |
          node tools/apple-rules.mjs ios/Orbit/Rules
          brew install --quiet xcodegen librsvg
          tools/apple-icon.sh ios/Orbit/Assets.xcassets
          xcodegen generate --spec ios/project.yml

      - name: Set up the App Store Connect key
        env:
          KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          IDENTITY: ${{ secrets.MAC_SIGNING_IDENTITY }}
        run: |
          [ -n "$KEY_P8" ] && [ -n "$KEY_ID" ] && [ -n "$ISSUER_ID" ] || { echo "::error::Set the ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8_BASE64 secrets"; exit 1; }
          team=$(echo "$IDENTITY" | sed -n 's/.*(\([A-Z0-9]\{10\}\))$/\1/p')
          [ -n "$team" ] || { echo "::error::No team id in MAC_SIGNING_IDENTITY"; exit 1; }
          echo "::add-mask::$team"
          echo "$KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "TEAM_ID=$team"
            echo "AUTH_KEY_ID=$KEY_ID"
            echo "AUTH_ISSUER_ID=$ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Archive
        run: |
          set -o pipefail
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$AUTH_KEY_ID" -authenticationKeyIssuerID "$AUTH_ISSUER_ID")
          xcodebuild archive -project ios/Orbit.xcodeproj -scheme Orbit -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/Orbit.xcarchive" "${auth[@]}" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION="${{ github.run_number }}" |
            grep -E "error:|warning: .*Orbit/|\*\* ARCHIVE" || true
          test -d "$RUNNER_TEMP/Orbit.xcarchive"

      - name: Upload to TestFlight
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$AUTH_KEY_ID" -authenticationKeyIssuerID "$AUTH_ISSUER_ID")
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Orbit.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" "${auth[@]}" |
            tee "$RUNNER_TEMP/export.log" | grep -E "error|Upload|EXPORT" || true
          grep -q "EXPORT SUCCEEDED" "$RUNNER_TEMP/export.log"
          echo "Build ${{ github.run_number }} uploaded to TestFlight" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
