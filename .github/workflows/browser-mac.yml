name: Orbit browser (Mac)

# Builds Orbit's Chromium fork for macOS on Apple silicon. Chromium 157 needs the macOS 27 SDK,
# which only GitHub's Xcode 27 preview image has so far.
# Stage 1 continues from a stage saved by an earlier run (kept 5 days). Clear resume_run to build
# from scratch.

on:
  push:
    branches: [fork]
    paths:
      - chromium/**
      - tools/chromium/**
      - .github/workflows/chromium-stage.yml
      - .github/workflows/browser-mac.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: browser-mac
  cancel-in-progress: true

jobs:
  stage1:
    uses: ./.github/workflows/chromium-stage.yml
    secrets: inherit
    with: { stage: 1, runner: xcode-27, targets: chrome, resume_run: "42743786854", resume_state: 3 }
  stage2:
    needs: stage1
    if: needs.stage1.outputs.done != 'true'
    uses: ./.github/workflows/chromium-stage.yml
    secrets: inherit
    with: { stage: 2, runner: xcode-27, targets: chrome }
  stage3:
    needs: stage2
    if: needs.stage2.outputs.done != 'true'
    uses: ./.github/workflows/chromium-stage.yml
    secrets: inherit
    with: { stage: 3, runner: xcode-27, targets: chrome }
  stage4:
    needs: stage3
    if: needs.stage3.outputs.done != 'true'
    uses: ./.github/workflows/chromium-stage.yml
    secrets: inherit
    with: { stage: 4, runner: xcode-27, targets: chrome }
  stage5:
    needs: stage4
    if: needs.stage4.outputs.done != 'true'
    uses: ./.github/workflows/chromium-stage.yml
    secrets: inherit
    with: { stage: 5, runner: xcode-27, targets: chrome }
  stage6:
    needs: stage5
    if: needs.stage5.outputs.done != 'true'
    uses: ./.github/workflows/chromium-stage.yml
    secrets: inherit
    with: { stage: 6, runner: xcode-27, targets: chrome }
  stage7:
    needs: stage6
    if: needs.stage6.outputs.done != 'true'
    uses: ./.github/workflows/chromium-stage.yml
    secrets: inherit
    with: { stage: 7, runner: xcode-27, targets: chrome }
  stage8:
    needs: stage7
    if: needs.stage7.outputs.done != 'true'
    uses: ./.github/workflows/chromium-stage.yml
    secrets: inherit
    with: { stage: 8, runner: xcode-27, targets: chrome }
  stage9:
