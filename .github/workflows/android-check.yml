name: Orbit Android check

# Fresh install of an Android build on phone and tablet emulators (tools/android/check): first
# launch, new tab pages, clock and a crawl of every app menu item, with logcat, the crash buffer and
# crash stacks read through the build's R8 mapping. Runs by hand for any build, or on pushes to the
# check itself against APK_RUN.

on:
  workflow_dispatch:
    inputs:
      apk_run:
        description: run id of the Android x64 build to check
        type: string
        default: ""
      mode:
        description: full check, splash (cold starts with different tabs active) or windows (first launch and the new and private window step only)
        type: choice
        options: [full, splash, windows]
        default: full
  push:
    branches: [v107]
    paths:
      - tools/android/check/**
      - .github/workflows/android-check.yml

permissions:
  contents: read
  actions: read

env:
  APK_RUN: "44799066806"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: phone
            profile: pixel_6
            skin: ""
          - device: tablet
            profile: pixel_c
            skin: -skin 2560x1440
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: orbit-android-x64
          path: apk
          run-id: ${{ inputs.apk_run || env.APK_RUN }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: orbit-android-x64-mapping
          path: mapping
          run-id: ${{ inputs.apk_run || env.APK_RUN }}
          github-token: ${{ github.token }}

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Check a fresh install on the emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          CHECK_MODE: ${{ inputs.mode || 'full' }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim ${{ matrix.skin }}
          disable-animations: true
          script: bash tools/android/check/check.sh apk/ChromePublic.apk ${{ runner.temp }}/check

      - name: Read crash and thread stacks with the R8 mapping
        if: always()
        run: |
          out="$RUNNER_TEMP/check"
          map=$(ls mapping/*.mapping 2> /dev/null | head -1)
          stacks=$(ls "$out"/*java-stacks.txt 2> /dev/null || true)
          if [ -z "$map" ] || { [ ! -s "$out/crash.txt" ] && [ -z "$stacks" ]; }; then echo "no mapping, crashes or stacks"; exit 0; fi
          version=$(curl -fsS https://dl.google.com/android/maven2/com/android/tools/r8/maven-metadata.xml | sed -n 's|.*<release>\(.*\)</release>.*|\1|p')
          curl -fsSL -o "$RUNNER_TEMP/r8.jar" "https://dl.google.com/android/maven2/com/android/tools/r8/$version/r8-$version.jar"
          echo "R8 $version"
          retrace() { java -cp "$RUNNER_TEMP/r8.jar" com.android.tools.r8.retrace.Retrace "$map" "$1" > "${1%.txt}-retraced.txt" || true; }
          if [ -s "$out/crash.txt" ]; then
            retrace "$out/crash.txt"
            head -300 "$out/crash-retraced.txt"
          fi
          for f in $stacks; do retrace "$f"; done

      - name: Keep the report, screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-check-${{ matrix.device }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/check
          if-no-files-found: ignore
