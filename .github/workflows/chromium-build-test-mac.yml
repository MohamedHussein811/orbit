name: Chromium build test (Mac)

# Answers one question: can free GitHub runners compile unmodified Chromium for macOS on Apple silicon?
# Chromium 157 needs the macOS 27 SDK, which only GitHub's Xcode 27 preview image has so far.

on:
  push:
    branches: [chromium-build-test-mac]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: chromium-build-test-mac
  cancel-in-progress: true

jobs:
  stage1:
    uses: ./.github/workflows/chromium-stage.yml
    with: { stage: 1, runner: xcode-27, targets: chrome }
  stage2:
    needs: stage1
    if: needs.stage1.outputs.done != 'true'
    uses: ./.github/workflows/chromium-stage.yml
    with: { stage: 2, runner: xcode-27, targets: chrome }
  stage3:
    needs: stage2
    if: needs.stage2.outputs.done != 'true'
    uses: ./.github/workflows/chromium-stage.yml
    with: { stage: 3, runner: xcode-27, targets: chrome }
  stage4:
    needs: stage3
    if: needs.stage3.outputs.done != 'true'
    uses: ./.github/workflows/chromium-stage.yml
    with: { stage: 4, runner: xcode-27, targets: chrome }
  stage5:
    needs: stage4
    if: needs.stage4.outputs.done != 'true'
    uses: ./.github/workflows/chromium-stage.yml
    with: { stage: 5, runner: xcode-27, targets: chrome }
  stage6:
