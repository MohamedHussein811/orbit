name: Engine watch

# Proposes an engine update when CEF ships a newer stable build. The CI suite gates the merge.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  watch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Compare the pin with the newest stable build
        id: check
        run: |
          node tools/engine.mjs check > check.json || true
          cat check.json
          jq -e .pinned check.json > /dev/null
          echo "current=$(jq -r .current check.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .newestStable check.json)" >> "$GITHUB_OUTPUT"
          echo "chromium=$(jq -r .newestChromium check.json)" >> "$GITHUB_OUTPUT"

      - name: Propose the update
        if: steps.check.outputs.current == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
          CHROMIUM: ${{ steps.check.outputs.chromium }}
        run: |
          branch="engine/$CHROMIUM"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "branch $branch already exists"
            exit 0
          fi
          node tools/engine.mjs pin "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add engine/engine.json
          git commit -m "Update engine to Chromium $CHROMIUM"
          git push origin "$branch"
          gh pr create --title "Update engine to Chromium $CHROMIUM" --body "Pins CEF $VERSION, the newest stable build. Check the Chromium release notes for security fixes before merging."
          gh workflow run ci.yml --ref "$branch"
