name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Types and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit


  setup:
    name: Windows setup script compiles
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compile the setup around a stand-in installer
        shell: bash
        run: |
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -x "$iscc" ] || choco install innosetup -y --no-progress > /dev/null
          mkdir -p out
          MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL="*" "$iscc" /Qp /DVersion=1.0.0.0 "/DInstaller=C:\Windows\System32\whoami.exe" \
            "/DBranding=$(cygpath -w "$PWD/branding")" "/O$(cygpath -w "$PWD/out")" "$(cygpath -w "$PWD/tools/chromium/installer/orbit.iss")"
          ls -l out
