name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Types and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit


  setup:
    name: Windows setup script compiles
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compile the setup around a stand-in installer
        shell: bash
        run: |
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -x "$iscc" ] || choco install innosetup -y --no-progress > /dev/null
          mkdir -p out
          node tools/chromium/installer/privacy-text.mjs out/privacy.txt
          MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL="*" "$iscc" /Qp /DVersion=1.0.0.0 "/DInstaller=C:\Windows\System32\whoami.exe" \
            "/DBranding=$(cygpath -w "$PWD/branding")" "/DPrivacy=$(cygpath -w "$PWD/out/privacy.txt")" "/O$(cygpath -w "$PWD/out")" "$(cygpath -w "$PWD/tools/chromium/installer/orbit.iss")"
          ls -l out

  apt:
    name: Linux package list signs and resolves
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sign a package list for a stand-in package with a throwaway key, then resolve it with apt
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils > /dev/null
          export GNUPGHOME=$(mktemp -d)
          gpg --batch --passphrase '' --quick-generate-key "Orbit test <test@example.invalid>" ed25519 sign 1d
          gpg --batch --armor --export > "$RUNNER_TEMP/test.asc"
          key=$(gpg --batch --armor --pinentry-mode loopback --passphrase '' --export-secret-keys)
          # apt reads keys and files as its own user, which cannot enter the runner's home folder.
          repo=/tmp/orbit-apt/repo
          mkdir -p "$repo" "$RUNNER_TEMP/pkg/DEBIAN"
          printf 'Package: orbit-browser\nVersion: 157.1.8103.38\nArchitecture: amd64\nMaintainer: NovaTech\nDescription: stand-in\n' > "$RUNNER_TEMP/pkg/DEBIAN/control"
          dpkg-deb --root-owner-group --build "$RUNNER_TEMP/pkg" "$repo/orbit_157.1.8103.38_amd64.deb"
          ORBIT_APT_KEY="$key" ORBIT_APT_PUBLIC="$RUNNER_TEMP/test.asc" bash tools/apt-repo.sh "$repo"
          chmod -R a+rX /tmp/orbit-apt
          sudo install -m 644 "$RUNNER_TEMP/test.asc" /usr/share/keyrings/orbit-archive-keyring.asc
          sed -e "s|https://github.com/MohamedHussein811/orbit/releases/latest/download/|file://$repo/|" \
            tools/chromium/linux/orbit.sources > /tmp/orbit-apt/orbit.sources
          sudo apt-get update -o Dir::Etc::sourcelist=/tmp/orbit-apt/orbit.sources -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
          apt-cache -o Dir::Etc::sourcelist=/tmp/orbit-apt/orbit.sources -o Dir::Etc::sourceparts=- policy orbit-browser | tee "$RUNNER_TEMP/policy.txt"
          grep -q "Candidate: 157.1.8103.38" "$RUNNER_TEMP/policy.txt"


  apt-upgrade:
    name: apt upgrades the previous release to the latest
    # Downloads two real releases, so it runs only when started by hand.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install the previous release's .deb, then let apt upgrade it from Orbit's package list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tags=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 5 --json tagName --jq '.[].tagName')
          latest=$(echo "$tags" | sed -n 1p)
          previous=$(echo "$tags" | sed -n 2p)
          gh release download "$previous" --repo "$GITHUB_REPOSITORY" --pattern '*_amd64.deb' --dir /tmp/previous
          sudo apt-get update -qq
          sudo apt-get install -y -qq /tmp/previous/*.deb > /dev/null
          before=$(dpkg-query -W -f='${Version}' orbit-browser)
          test -f /etc/apt/sources.list.d/orbit.sources
          sudo apt-get update
          sudo apt-get install -y --only-upgrade orbit-browser
          after=$(dpkg-query -W -f='${Version}' orbit-browser)
          wanted=$(gh release view "$latest" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sed -n 's/^orbit_\(.*\)_amd64\.deb$/\1/p')
          echo "$previous ($before) -> $after, latest release $latest ($wanted)"
          test "$after" = "$wanted"
          dpkg --compare-versions "$after" gt "$before"
