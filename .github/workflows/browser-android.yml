name: Orbit browser (Android)

# Builds Chromium for Android on free runners and checks the APK on an emulator. Manual only:
# it does not follow pushes, so desktop work never starts it. Stage 1 can continue from a stage
# saved by an earlier run of the same Chromium version (kept 5 days) with resume_run/resume_state.

on:
  workflow_dispatch:
    inputs:
      cpu:
        description: target_cpu (arm64 for phones, x64 for a native emulator test)
        type: choice
        options: [arm64, x64]
        default: arm64
      resume_run:
        description: run id to continue from (empty builds from scratch)
        type: string
        default: ""
      resume_state:
        description: saved stage number in that run
        type: number
        default: 0

permissions:
  contents: read
  actions: read

concurrency:
  group: browser-android-${{ github.ref }}-${{ inputs.cpu }}
  cancel-in-progress: true

jobs:
  stage1:
    uses: ./.github/workflows/android-stage.yml
    with:
      stage: 1
      cpu: ${{ inputs.cpu }}
      resume_run: ${{ inputs.resume_run }}
      resume_state: ${{ inputs.resume_state }}
  stage2:
    needs: stage1
    if: needs.stage1.outputs.done != 'true'
    uses: ./.github/workflows/android-stage.yml
    with:
      stage: 2
      cpu: ${{ inputs.cpu }}
  stage3:
    needs: stage2
    if: needs.stage2.outputs.done != 'true'
    uses: ./.github/workflows/android-stage.yml
    with:
      stage: 3
      cpu: ${{ inputs.cpu }}
  stage4:
    needs: stage3
    if: needs.stage3.outputs.done != 'true'
    uses: ./.github/workflows/android-stage.yml
    with:
      stage: 4
      cpu: ${{ inputs.cpu }}
  stage5:
    needs: stage4
    if: needs.stage4.outputs.done != 'true'
    uses: ./.github/workflows/android-stage.yml
    with:
      stage: 5
      cpu: ${{ inputs.cpu }}
  stage6:
    needs: stage5
    if: needs.stage5.outputs.done != 'true'
    uses: ./.github/workflows/android-stage.yml
    with:
      stage: 6
      cpu: ${{ inputs.cpu }}
  stage7:
    needs: stage6
    if: needs.stage6.outputs.done != 'true'
    uses: ./.github/workflows/android-stage.yml
    with:
      stage: 7
      cpu: ${{ inputs.cpu }}
  stage8:
    needs: stage7
    if: needs.stage7.outputs.done != 'true'
    uses: ./.github/workflows/android-stage.yml
    with:
      stage: 8
      cpu: ${{ inputs.cpu }}
  stage9:
    needs: stage8
    if: needs.stage8.outputs.done != 'true'
    uses: ./.github/workflows/android-stage.yml
    with:
      stage: 9
      cpu: ${{ inputs.cpu }}
  stage10:
    needs: stage9
    if: needs.stage9.outputs.done != 'true'
    uses: ./.github/workflows/android-stage.yml
    with:
      stage: 10
      cpu: ${{ inputs.cpu }}
  emulator:
    needs: [stage1, stage2, stage3, stage4, stage5, stage6, stage7, stage8, stage9, stage10]
    if: always() && contains(needs.*.outputs.done, 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: orbit-android-${{ inputs.cpu }}
          path: apk

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the APK on an emulator and load a page
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash tools/android/smoke.sh apk/ChromePublic.apk

      - name: Keep the screen on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-smoke-screen
          path: ${{ runner.temp }}/smoke.png
          if-no-files-found: ignore
