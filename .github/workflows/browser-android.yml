name: Orbit browser (Android)

# Builds Chromium for Android on free runners and checks the APK on an emulator. Runs on pushes
# that change the Android build files (desktop work never starts it) or by hand. Stage 1 can
# continue from a stage saved by an earlier run of the same Chromium version (kept 5 days) with
# resume_run/resume_state (default: the x64 run set in stage1). Pushes build x64, which the
# x86_64 emulator runs natively; Chromium loads its library straight from the APK, so an arm64
# build cannot run there through translation.

on:
  push:
    branches: [design]
    paths:
      - tools/android/**
      - "!tools/android/smoke.sh"
      - .github/workflows/android-stage.yml
      - .github/workflows/browser-android.yml
  workflow_dispatch:
    inputs:
      cpu:
        description: target_cpu (arm64 for phones, x64 for a native emulator test)
        type: choice
        options: [arm64, x64]
        default: arm64
      resume_run:
        description: run id to continue from (empty builds from scratch)
        type: string
        default: ""
      resume_state:
        description: saved stage number in that run
        type: number
        default: 0

permissions:
  contents: read
  actions: read

concurrency:
  group: browser-android-${{ github.ref }}-${{ inputs.cpu || 'x64' }}
  cancel-in-progress: true

jobs:
  stage1:
    uses: ./.github/workflows/android-stage.yml
    secrets: inherit
    with:
      stage: 1
      cpu: ${{ inputs.cpu || 'x64' }}
      resume_run: ${{ inputs.resume_run || '44255121247' }}
      resume_state: ${{ inputs.resume_state || 3 }}
  stage2:
    needs: stage1
    if: needs.stage1.outputs.done != 'true'
    uses: ./.github/workflows/android-stage.yml
    secrets: inherit
    with:
      stage: 2
      cpu: ${{ inputs.cpu || 'x64' }}
  stage3:
    needs: stage2
    if: needs.stage2.outputs.done != 'true'
    uses: ./.github/workflows/android-stage.yml
    secrets: inherit
    with:
      stage: 3
      cpu: ${{ inputs.cpu || 'x64' }}
  stage4:
    needs: stage3
    if: needs.stage3.outputs.done != 'true'
    uses: ./.github/workflows/android-stage.yml
    secrets: inherit
    with:
      stage: 4
      cpu: ${{ inputs.cpu || 'x64' }}
  stage5:
    needs: stage4
    if: needs.stage4.outputs.done != 'true'
    uses: ./.github/workflows/android-stage.yml
    secrets: inherit
    with:
      stage: 5
      cpu: ${{ inputs.cpu || 'x64' }}
  stage6:
    needs: stage5
    if: needs.stage5.outputs.done != 'true'
    uses: ./.github/workflows/android-stage.yml
    secrets: inherit
    with:
      stage: 6
      cpu: ${{ inputs.cpu || 'x64' }}
  stage7:
    needs: stage6
    if: needs.stage6.outputs.done != 'true'
    uses: ./.github/workflows/android-stage.yml
    secrets: inherit
    with:
      stage: 7
      cpu: ${{ inputs.cpu || 'x64' }}
  stage8:
    needs: stage7
    if: needs.stage7.outputs.done != 'true'
    uses: ./.github/workflows/android-stage.yml
    secrets: inherit
    with:
      stage: 8
      cpu: ${{ inputs.cpu || 'x64' }}
  stage9:
    needs: stage8
    if: needs.stage8.outputs.done != 'true'
    uses: ./.github/workflows/android-stage.yml
    secrets: inherit
    with:
      stage: 9
      cpu: ${{ inputs.cpu || 'x64' }}
  stage10:
    needs: stage9
    if: needs.stage9.outputs.done != 'true'
    uses: ./.github/workflows/android-stage.yml
    secrets: inherit
    with:
      stage: 10
      cpu: ${{ inputs.cpu || 'x64' }}
  emulator:
    needs: [stage1, stage2, stage3, stage4, stage5, stage6, stage7, stage8, stage9, stage10]
    if: always() && contains(needs.*.outputs.done, 'true')
    uses: ./.github/workflows/android-emulator.yml
    with:
      apk_run: ${{ github.run_id }}
      cpu: ${{ inputs.cpu || 'x64' }}
