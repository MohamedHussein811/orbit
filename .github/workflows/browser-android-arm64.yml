name: Orbit browser (Android arm64)

# The phone build: arm64 APK and Play bundle (.aab), on the same chained stages as
# browser-android.yml, which builds x64 for the emulator check. An arm64 APK cannot run on the
# x86_64 emulator, so this chain has no emulator job. Stage 1 continues from a saved arm64 stage
# (kept 5 days) given by resume_run/resume_state.

on:
  push:
    branches: [design]
    paths:
      - tools/android/**
      - "!tools/android/smoke.sh"
      - .github/workflows/android-stage.yml
      - .github/workflows/browser-android-arm64.yml
  workflow_dispatch:
    inputs:
      resume_run:
        description: run id to continue from (empty builds from scratch)
        type: string
        default: ""
      resume_state:
        description: saved stage number in that run
        type: number
        default: 0

permissions:
  contents: read
  actions: read

concurrency:
  group: browser-android-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage1:
    uses: ./.github/workflows/android-stage.yml
    secrets: inherit
    with:
      stage: 1
      cpu: arm64
      resume_run: ${{ inputs.resume_run || '44550000484' }}
      resume_state: ${{ fromJSON(format('{0}', inputs.resume_state || 0)) || 2 }}
  stage2:
    needs: stage1
    if: needs.stage1.outputs.done != 'true'
    uses: ./.github/workflows/android-stage.yml
    secrets: inherit
    with:
      stage: 2
      cpu: arm64
  stage3:
    needs: stage2
    if: needs.stage2.outputs.done != 'true'
    uses: ./.github/workflows/android-stage.yml
    secrets: inherit
    with:
      stage: 3
      cpu: arm64
  stage4:
    needs: stage3
    if: needs.stage3.outputs.done != 'true'
    uses: ./.github/workflows/android-stage.yml
    secrets: inherit
    with:
      stage: 4
      cpu: arm64
  stage5:
    needs: stage4
    if: needs.stage4.outputs.done != 'true'
    uses: ./.github/workflows/android-stage.yml
    secrets: inherit
    with:
      stage: 5
      cpu: arm64
  stage6:
    needs: stage5
    if: needs.stage5.outputs.done != 'true'
    uses: ./.github/workflows/android-stage.yml
    secrets: inherit
    with:
      stage: 6
      cpu: arm64
  stage7:
    needs: stage6
    if: needs.stage6.outputs.done != 'true'
    uses: ./.github/workflows/android-stage.yml
    secrets: inherit
    with:
      stage: 7
      cpu: arm64
  stage8:
    needs: stage7
    if: needs.stage7.outputs.done != 'true'
    uses: ./.github/workflows/android-stage.yml
    secrets: inherit
    with:
      stage: 8
      cpu: arm64
  stage9:
    needs: stage8
    if: needs.stage8.outputs.done != 'true'
    uses: ./.github/workflows/android-stage.yml
    secrets: inherit
    with:
      stage: 9
      cpu: arm64
  stage10:
    needs: stage9
    if: needs.stage9.outputs.done != 'true'
    uses: ./.github/workflows/android-stage.yml
    secrets: inherit
    with:
      stage: 10
      cpu: arm64
  sign:
    needs: [stage1, stage2, stage3, stage4, stage5, stage6, stage7, stage8, stage9, stage10]
    if: always() && contains(needs.*.outputs.done, 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: orbit-android-arm64
          path: android

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: orbit-android-bundle
          path: android

      - name: Sign with the upload key
        id: sign
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::notice::No Android upload key yet; the APK and bundle stay unsigned for Play"
            exit 0
          fi
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          badging=$("$aapt2" dump badging android/ChromePublic.apk)
          echo "$badging" | head -1
          version=$(echo "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          tools/android/sign.sh android/ChromePublic.apk android/ChromePublic.aab signed "$version"
          echo "signed=yes" >> "$GITHUB_OUTPUT"

      - name: Keep the signed APK and bundle
        if: steps.sign.outputs.signed == 'yes'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orbit-android-signed
          path: signed/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
