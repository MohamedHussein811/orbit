name: Release

# Publishes a GitHub Release from three finished browser builds: the Windows setup (code-signed when
# signing is set up), the macOS disk image, the Linux packages with a signed apt package list, the
# Windows updater's signed feed, and the built-in extension with its update feed, so installed
# copies of Orbit receive new Shields rules between releases. Checksums cover every file.
#
# Windows signing, first match wins:
#   SignPath:    secret SIGNPATH_API_TOKEN, variables SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG,
#                SIGNPATH_SIGNING_POLICY_SLUG, SIGNPATH_ARTIFACT_CONFIGURATION_SLUG. Each request
#                waits for an approver in SignPath (up to five hours).
#   Certificate: secrets WINDOWS_CERTIFICATE_PFX_BASE64 and WINDOWS_CERTIFICATE_PASSWORD.
#   Neither:     the setup stays unsigned and the release notes say so.
# Android (optional, android_run): the arm64 APK is signed with the upload key and published with
# the release; the signed Play bundle is kept as the orbit-play-bundle artifact for Google Play.
# Secrets ANDROID_UPLOAD_KEYSTORE_BASE64 (PKCS12, alias "orbit") and ANDROID_UPLOAD_KEYSTORE_PASSWORD.
# Required secrets: ORBIT_UPDATE_KEY (Ed25519, signs the Windows update feed) and ORBIT_APT_KEY
# (signs the apt package list). docs/RELEASING.md has the details.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, such as v1.0.0
        required: true
      windows_run:
        description: Run id of a green "Orbit browser (Windows)" build
        required: true
      mac_run:
        description: Run id of a green "Orbit browser (Mac)" build
        required: true
      linux_run:
        description: Run id of a green "Orbit browser (Linux)" build
        required: true
      android_run:
        description: Run id of a green "Orbit browser (Android arm64)" build (empty leaves Android out)
        required: false
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the signing keys are set
        env:
          ORBIT_UPDATE_KEY: ${{ secrets.ORBIT_UPDATE_KEY }}
          ORBIT_APT_KEY: ${{ secrets.ORBIT_APT_KEY }}
        run: |
          [ -n "$ORBIT_UPDATE_KEY" ] || { echo "::error::Set the ORBIT_UPDATE_KEY secret (docs/RELEASING.md)"; exit 1; }
          [ -n "$ORBIT_APT_KEY" ] || { echo "::error::Set the ORBIT_APT_KEY secret (docs/RELEASING.md)"; exit 1; }

      - name: Get the Windows setup
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: orbit-package-Windows, path: dist, run-id: "${{ inputs.windows_run }}", github-token: "${{ github.token }}" }

      - name: Get the macOS disk image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: orbit-package-macOS, path: dist, run-id: "${{ inputs.mac_run }}", github-token: "${{ github.token }}" }

      - name: Get the Linux packages and the extension
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: orbit-package-Linux, path: dist, run-id: "${{ inputs.linux_run }}", github-token: "${{ github.token }}" }

      - name: Get the Android APK
        if: inputs.android_run != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: orbit-android-arm64, path: android, run-id: "${{ inputs.android_run }}", github-token: "${{ github.token }}" }

      - name: Get the Android Play bundle
        if: inputs.android_run != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: orbit-android-bundle, path: android, run-id: "${{ inputs.android_run }}", github-token: "${{ github.token }}" }

      - name: Sign the Android APK and Play bundle
        if: inputs.android_run != ''
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          version=$(ls dist | sed -n 's/^OrbitSetup-\([0-9.]*\)-x64\.exe$/\1/p')
          tools/android/sign.sh android/ChromePublic.apk android/ChromePublic.aab play "$version"
          mv play/*.apk dist/
          rm -rf android

      - name: Keep the Play bundle for upload
        if: inputs.android_run != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orbit-play-bundle
          path: play/*.aab
          retention-days: 30
          if-no-files-found: error

      - name: Choose how to sign the Windows setup
        id: signing
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
        run: |
          setup=$(cd dist && ls OrbitSetup-*-x64.exe)
          echo "setup=$setup" >> "$GITHUB_OUTPUT"
          if [ -n "$SIGNPATH_API_TOKEN" ]; then echo "method=signpath" >> "$GITHUB_OUTPUT"
          elif [ -n "$PFX" ]; then echo "method=certificate" >> "$GITHUB_OUTPUT"
          else echo "method=" >> "$GITHUB_OUTPUT"; echo "::warning::The Windows setup is not signed: no SignPath token or certificate is set"
          fi

      - name: Hand the setup to SignPath
        if: steps.signing.outputs.method == 'signpath'
        id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orbit-setup-unsigned
          path: dist/${{ steps.signing.outputs.setup }}
          if-no-files-found: error
          retention-days: 3

      - name: Sign with SignPath
        if: steps.signing.outputs.method == 'signpath'
        uses: signpath/github-action-submit-signing-request@4a84eb4ad763290f059275786f2deed97c2c672b # v3.1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 18000
          output-artifact-directory: signed

      - name: Sign with the certificate
        if: steps.signing.outputs.method == 'certificate'
        env:
          PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          SETUP: ${{ steps.signing.outputs.setup }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends osslsigncode > /dev/null
          mkdir -p signed
          umask 077
          echo "$PFX" | base64 --decode > "$RUNNER_TEMP/certificate.pfx"
          osslsigncode sign -pkcs12 "$RUNNER_TEMP/certificate.pfx" -pass "$PFX_PASSWORD" -h sha256 \
            -n "Orbit" -i "https://github.com/${{ github.repository }}" -t http://timestamp.digicert.com \
            -in "dist/$SETUP" -out "signed/$SETUP"
          rm -f "$RUNNER_TEMP/certificate.pfx"

      - name: Put the signed setup in place
        if: steps.signing.outputs.method != ''
        env:
          SETUP: ${{ steps.signing.outputs.setup }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends osslsigncode > /dev/null
          osslsigncode extract-signature -in "signed/$SETUP" -out "$RUNNER_TEMP/signature.p7"
          osslsigncode verify -in "signed/$SETUP" || echo "::warning::The signature is present but this machine could not verify its chain"
          mv "signed/$SETUP" "dist/$SETUP"

      - name: Sign the apt package list
        env:
          ORBIT_APT_KEY: ${{ secrets.ORBIT_APT_KEY }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils > /dev/null
          bash tools/apt-repo.sh dist

      - name: Write the update feeds and checksums
        env:
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
          ORBIT_UPDATE_KEY: ${{ secrets.ORBIT_UPDATE_KEY }}
          WINDOWS_SIGNED: ${{ steps.signing.outputs.method }}
        run: node tools/release-files.mjs dist "$TAG" "$REPO"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release create "$TAG" dist/* --title "Orbit $TAG" --notes-file NOTES.md --target "$GITHUB_SHA"
