name: Release

# Publishes a GitHub Release from three finished browser builds: the Windows installer, the macOS
# disk image, the Linux packages, and the built-in extension with its update feed, so installed
# copies of Orbit receive new Shields rules between releases. Checksums cover every file.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, such as v1.0.0
        required: true
      windows_run:
        description: Run id of a green "Orbit browser (Windows)" build
        required: true
      mac_run:
        description: Run id of a green "Orbit browser (Mac)" build
        required: true
      linux_run:
        description: Run id of a green "Orbit browser (Linux)" build
        required: true

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get the Windows installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: orbit-package-Windows, path: dist, run-id: "${{ inputs.windows_run }}", github-token: "${{ github.token }}" }

      - name: Get the macOS disk image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: orbit-package-macOS, path: dist, run-id: "${{ inputs.mac_run }}", github-token: "${{ github.token }}" }

      - name: Get the Linux packages and the extension
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: orbit-package-Linux, path: dist, run-id: "${{ inputs.linux_run }}", github-token: "${{ github.token }}" }

      - name: Write the update feeds and checksums
        env:
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: node tools/release-files.mjs dist "$TAG" "$REPO"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release create "$TAG" dist/* --title "Orbit $TAG" --notes-file NOTES.md --target "$GITHUB_SHA"
