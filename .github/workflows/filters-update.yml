name: Filter update

# Proposes fresh blocking rules once a week. The CI suite gates the merge.

on:
  schedule:
    - cron: "43 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: node tools/filters.mjs update

      - name: Propose the update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="filters/$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add filters/rules
          git commit -m "Update blocking rules"
          git push origin "$branch"
          gh pr create --title "Update blocking rules" --body "Rebuilt from the lists in filters/sources.json. Sources, hashes and rule counts are in filters/rules/meta.json."
          gh workflow run ci.yml --ref "$branch"
