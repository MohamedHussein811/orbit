<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dangerous site blocked</title>
<link rel="icon" href="../icons/orbit-32.png">
<link rel="stylesheet" href="blocked.css">
</head>
<body>
<main>
  <img src="../icons/orbit-48.png" alt="" width="48" height="48">
  <h1>Orbit stopped this page</h1>
  <p id="host"></p>
  <p>This address is on a public list of sites known for malware or phishing. Such a site can steal passwords or install harmful software.</p>
  <div class="actions">
    <button id="back" class="primary" type="button">Go back</button>
    <button id="continue" type="button">Continue to the site</button>
  </div>
  <p class="note">If you continue, Orbit allows this site until you close the browser.</p>
</main>
<script type="module" src="blocked.js"></script>
</body>
</html>
